[package]
name = "defs"
description = "Fable def format library: typed def model, text parsing, and binary I/O"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "1.16.3", features = ["derive", "extern_crate_std"] }
derive_more = { version = "1.0.0", features = ["from", "display", "error"] }
miniz_oxide = "0.9"
defs-derive = { path = "../defs-derive" }
